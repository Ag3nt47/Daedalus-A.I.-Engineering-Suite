[build-system]
requires = ["setuptools>=75", "wheel>=0.44"]
build-backend = "setuptools.build_meta"

[project]
name = "daedalus-ai-suite"
version = "0.1.0"
description = "A local-first workbench for learning and building neural networks from NumPy primitives."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { file = "LICENSE" }
authors = [{ name = "Daedalus contributors" }]
keywords = ["artificial-intelligence", "neural-networks", "autograd", "education", "numpy"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=2.0,<3",
  "PySide6>=6.7,<7",
  "psutil>=5.9,<8",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.9,<2",
  "cyclonedx-bom>=7.3,<8",
  "pip-audit>=2.7,<3",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.9,<1",
]

[project.gui-scripts]
daedalus-ai = "daedalus.__main__:main"

[project.scripts]
daedalus-guard = "daedalus.services.release_guard:cli"

[tool.setuptools.packages.find]
where = ["src"]
include = ["daedalus*"]

[tool.setuptools.package-data]
daedalus = ["assets/*.ico", "assets/*.png", "resources/*.json", "resources/*.md"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["build", "dist", ".venv", ".tmp"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "build", "dist"]
skips = ["B101"]
